name: Android CI/CD Workflow

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GRADLE_OPTS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="2.6.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted App Version: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest 2> >(grep -v -E "AWT-EventQueue-0|ksp.com.intellij" >&2)

      - name: Build Debug APK
        run: ./gradlew assembleDebug 2> >(grep -v -E "AWT-EventQueue-0|ksp.com.intellij" >&2)

      - name: Build Debug Android App Bundle (AAB)
        run: ./gradlew bundleDebug 2> >(grep -v -E "AWT-EventQueue-0|ksp.com.intellij" >&2)

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Debug Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-bundle
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 7

      - name: Prepare APK & AAB for GitHub Releases
        run: |
          VERSION="${{ steps.app_version.outputs.VERSION }}"
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk "release-assets/NetWorthTracker-v${VERSION}-debug.apk"
          cp app/build/outputs/bundle/debug/*.aab "release-assets/NetWorthTracker-v${VERSION}-debug.aab"

      - name: Publish New Version to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: "v${{ steps.app_version.outputs.VERSION }}"
          name: "Net Worth Tracker v${{ steps.app_version.outputs.VERSION }}"
          body: |
            ## 🚀 Net Worth Tracker v${{ steps.app_version.outputs.VERSION }} (Latest Release)

            ### 📱 Download & Direct Install:
            - **Debug APK**: Download **`NetWorthTracker-v${{ steps.app_version.outputs.VERSION }}-debug.apk`** below to install directly on your Android phone.
            - **Android App Bundle**: **`NetWorthTracker-v${{ steps.app_version.outputs.VERSION }}-debug.aab`** for Google Play Console / testing.

            ### ✨ What's New in v${{ steps.app_version.outputs.VERSION }}:
            - 📅 **Dedicated Event Reminders**: Added comprehensive financial event scheduling (Tax filing deadlines, Insurance renewals, FD maturities, Portfolio rebalancing, Birthdays/Anniversaries, Property taxes, Vehicle service) with quick presets and live calendar calculations.
            - 🔔 **Instant Alert Testing**: One-tap "Test Alert" triggers system notification channels with custom sound, high priority, and countdown badges.
            - 🧭 **Optimized 6-Tab Navigation Bar**: Fixed bottom bar text wrapping so Dashboard, Assets, Ledger, Analytics, Reminders, and Settings display in a single neat row without awkward line breaks.
            - 🎙️ **Hands-free Voice Assistant**: Speak naturally to add events and reminders (*"Add event reminder Tax Filing in 5 days"*).
            - 🛡️ **Privacy & Biometric Lock**: 100% offline-first Room database, biometric fingerprint/face authentication, and zero third-party trackers.
          files: |
            release-assets/NetWorthTracker-v${{ steps.app_version.outputs.VERSION }}-debug.apk
            release-assets/NetWorthTracker-v${{ steps.app_version.outputs.VERSION }}-debug.aab
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
