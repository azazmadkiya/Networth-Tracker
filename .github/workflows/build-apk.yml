name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Raw Java Version Line: $JAVA_VER_OUTPUT"

          # Extract major version number (handles format "17.0.x" or "1.8.x")
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect active Java major version."
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or higher. Detected version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to generate ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Listing files inside app/build/outputs/apk if available:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::The generated APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::The file does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null)
          echo "Verified APK at $EXPECTED_APK (Size: $APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="app"
          fi
          # Sanitize repository name to safe alphanumeric and dashes
          CLEAN_REPO_NAME=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Environment ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset must have .apk extension: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### 📱 Debug APK Build #${{ github.run_number }}

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Workflow Run Number:** #${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Target Commit SHA:** \`${{ github.sha }}\`
          - **Asset Filename:** \`${ASSET_NAME}\`

          > **Note:**
          > - This APK is intended for testing and development preview.
          > - This is not a Google Play Store production release.
          > - The APK is signed with a standard debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          SERVER_URL="${{ github.server_url }}"
          REPO="${{ github.repository }}"

          echo "### 🚀 Android Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "========================================================"
            echo "🎉 GitHub Release created successfully!"
            echo "Release Tag:   $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL:   $RELEASE_URL"
            echo "APK Asset:     $ASSET_NAME"
            echo "========================================================"

            # Verify with gh release view
            gh release view "$RELEASE_TAG" || true

            echo "✅ **Debug APK successfully published to GitHub Releases!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📦 **Direct Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📱 **Direct APK Download:** Download \`$ASSET_NAME\` directly from the Assets section on the release page to your phone." >> "$GITHUB_STEP_SUMMARY"
            echo "- 🗄️ **Backup Artifact:** The Actions artifact \`app-debug-apk\` is also stored and available under the Actions summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "========================================================"
            echo "⚠️ Notice: Release publishing step did not complete ($RELEASE_OUTCOME)."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact Name: app-debug-apk"
            echo "========================================================"

            echo "⚠️ **Debug APK Built Successfully (Release Publishing Notice)**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- ✅ The debug APK was compiled and verified successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- 🗄️ **Download APK:** Download the \`app-debug-apk\` artifact directly from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "- ℹ️ *Release publishing encountered an issue or was skipped, but your APK build artifact is safe and available.*" >> "$GITHUB_STEP_SUMMARY"
          fi
